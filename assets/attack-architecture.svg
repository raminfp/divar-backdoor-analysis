<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 860" font-family="Vazirmatn, Tahoma, 'DejaVu Sans', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#334155"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#b91c1c"/>
    </marker>
    <style>
      .t{fill:#0f172a;font-size:15px}
      .tsm{fill:#334155;font-size:12.5px}
      .code{font-family:'DejaVu Sans Mono',monospace;font-size:12.5px;fill:#0f172a}
      .codeW{font-family:'DejaVu Sans Mono',monospace;font-size:12px;fill:#ffffff}
      .title{fill:#0f172a;font-size:17px;font-weight:bold}
      .step{fill:#ffffff;font-size:13px;font-weight:bold}
      .lbl{fill:#b91c1c;font-size:12.5px;font-weight:bold}
    </style>
  </defs>

  <rect x="0" y="0" width="1180" height="860" fill="#f8fafc"/>
  <text x="590" y="36" text-anchor="middle" class="title" direction="rtl">معماری حمله: اجرای کد از راه دور از طریق پوش‌نوتیفیکیشن — دیوار 11.14.5 → 11.14.20</text>

  <!-- Attacker / C2 -->
  <rect x="40" y="90" width="250" height="150" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="165" y="118" text-anchor="middle" class="title" direction="rtl">مهاجم</text>
  <text x="165" y="142" text-anchor="middle" class="tsm" direction="rtl">۱) کنترل کانال پوش</text>
  <text x="165" y="162" text-anchor="middle" class="tsm" direction="rtl">۲) میزبانی سرور فرمان (C2)</text>
  <rect x="62" y="178" width="206" height="46" rx="7" fill="#7f1d1d"/>
  <text x="165" y="198" text-anchor="middle" class="codeW">C2 server</text>
  <text x="165" y="215" text-anchor="middle" class="codeW">http://evil.ir/c</text>

  <!-- OneSignal push -->
  <rect x="40" y="300" width="250" height="90" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="165" y="330" text-anchor="middle" class="title" direction="rtl">سرور پوش</text>
  <text x="165" y="354" text-anchor="middle" class="tsm">OneSignal</text>
  <text x="165" y="374" text-anchor="middle" class="tsm" direction="rtl">تحویل پوش به دستگاه</text>

  <!-- App process big box -->
  <rect x="360" y="90" width="500" height="560" rx="14" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="610" y="118" text-anchor="middle" class="title" direction="rtl">فرآیند اپ دیوار (با سطح دسترسی خود اپ)</text>

  <!-- Wk.g.f -->
  <rect x="390" y="140" width="440" height="110" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="810" y="165" text-anchor="end" class="code">Wk.g.f(push, body, title)</text>
  <text x="810" y="186" text-anchor="end" class="tsm" direction="rtl">پوش را می‌خواند؛ شرط فعال‌سازی را چک می‌کند</text>
  <text x="810" y="208" text-anchor="end" class="code">if (title == push_id &amp;&amp; body is JSON</text>
  <text x="810" y="226" text-anchor="end" class="code">   with callback_url+campaign+action)</text>
  <text x="810" y="244" text-anchor="end" class="code">  → context.sendBroadcast(intent)</text>

  <!-- Handler -->
  <rect x="390" y="290" width="440" height="110" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="810" y="315" text-anchor="end" class="code">ChatPushNotificationOpenHandler</text>
  <text x="810" y="333" text-anchor="end" class="code">.onReceive(ctx, intent)</text>
  <text x="810" y="356" text-anchor="end" class="code">if (extras[dataString] == dataString)</text>
  <text x="810" y="378" text-anchor="end" class="code">  new Thread(new ReportDeserializer).start()</text>

  <!-- ReportDeserializer -->
  <rect x="390" y="440" width="440" height="180" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="810" y="465" text-anchor="end" class="code">ReportDeserializer  (Runnable)</text>
  <text x="810" y="489" text-anchor="end" class="code">a(): url = XOR(Base64(campaign), 0x68)</text>
  <text x="810" y="507" text-anchor="end" class="code">     GET url  (device info in User-Agent)</text>
  <text x="810" y="531" text-anchor="end" class="code">run(): Class.forName(report)...</text>
  <text x="810" y="549" text-anchor="end" class="code">  write payload → local</text>
  <text x="810" y="567" text-anchor="end" class="code">  getRuntime().exec(extra)   ← reflection</text>
  <text x="810" y="591" text-anchor="end" class="code">  sleep(15s); file.delete()  ← پاک‌سازی رد</text>
  <text x="810" y="611" text-anchor="end" class="lbl" direction="rtl">اجرای کد دلخواه با دسترسی اپ</text>

  <!-- Device / filesystem -->
  <rect x="360" y="680" width="500" height="120" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="610" y="708" text-anchor="middle" class="title" direction="rtl">دستگاه کاربر</text>
  <text x="610" y="732" text-anchor="middle" class="code">/data/data/ir.divar/files/x.so</text>
  <text x="610" y="756" text-anchor="middle" class="tsm" direction="rtl">توکن کاربر · دیتابیس و پیام‌های چت · همه مجوزهای اپ</text>
  <text x="610" y="778" text-anchor="middle" class="code">Runtime.getRuntime().exec("/system/bin/sh", x.so)</text>

  <!-- Right side: two JSON legend -->
  <rect x="920" y="140" width="230" height="200" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="1140" y="165" text-anchor="end" class="title" direction="rtl">JSON ۱ — فعال‌ساز</text>
  <text x="1140" y="185" text-anchor="end" class="tsm" direction="rtl">از پوش OneSignal</text>
  <text x="935" y="208" class="code">{</text>
  <text x="945" y="226" class="code">"push_id":"X",</text>
  <text x="945" y="244" class="code">"title":"X",</text>
  <text x="945" y="262" class="code">"body":"{...</text>
  <text x="955" y="280" class="code">callback_url,</text>
  <text x="955" y="298" class="code">campaign,</text>
  <text x="955" y="316" class="code">action }"</text>
  <text x="935" y="334" class="code">}</text>

  <rect x="920" y="440" width="230" height="200" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="1140" y="465" text-anchor="end" class="title" direction="rtl">JSON ۲ — فرمان C2</text>
  <text x="1140" y="485" text-anchor="end" class="tsm" direction="rtl">پاسخ سرور مهاجم</text>
  <text x="935" y="507" class="code">{ "format","parse",</text>
  <text x="945" y="525" class="code">"data","local",</text>
  <text x="945" y="543" class="code">"report":"Runtime",</text>
  <text x="945" y="561" class="code">"objectify":</text>
  <text x="955" y="579" class="code">"getRuntime",</text>
  <text x="945" y="597" class="code">"deserialize":"exec",</text>
  <text x="945" y="615" class="code">"extra":[...] }</text>

  <!-- Flow arrows -->
  <!-- attacker -> onesignal (push craft) -->
  <path d="M165 240 L165 300" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- onesignal -> Wk.g.f (JSON1) -->
  <path d="M290 338 Q340 300 388 230" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="300" y="250" width="70" height="22" rx="5" fill="#fff7ed" stroke="#c2410c"/>
  <text x="335" y="266" text-anchor="middle" class="lbl">JSON 1</text>
  <!-- Wk.g.f -> Handler -->
  <path d="M610 250 L610 290" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="616" y="258" width="150" height="22" rx="5" fill="#eef2ff" stroke="#475569"/>
  <text x="620" y="274" class="tsm">sendBroadcast(intent)</text>
  <!-- Handler -> ReportDeserializer -->
  <path d="M610 400 L610 440" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="618" y="426" class="tsm">new Thread().start()</text>
  <!-- ReportDeserializer -> C2 (request) and back -->
  <path d="M390 500 Q250 430 165 240" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowRed)"/>
  <rect x="185" y="420" width="150" height="22" rx="5" fill="#fef2f2" stroke="#b91c1c"/>
  <text x="190" y="436" class="lbl">GET + User-Agent</text>
  <path d="M165 240 Q250 360 390 475" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="190" y="372" width="70" height="22" rx="5" fill="#fef2f2" stroke="#b91c1c"/>
  <text x="225" y="388" text-anchor="middle" class="lbl">JSON 2</text>
  <!-- ReportDeserializer -> device exec -->
  <path d="M610 620 L610 680" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="618" y="666" class="lbl" direction="ltr">exec()</text>

  <!-- footer note -->
  <text x="40" y="700" class="tsm" direction="rtl">در 11.15.0 کل این زنجیره حذف شده است.</text>
  <text x="40" y="722" class="tsm" direction="rtl">— — — خط‌چین قرمز: مسیر فرمان از سرور C2</text>
  <text x="40" y="744" class="tsm" direction="rtl">خط ممتد: مسیر داخلی اپ</text>
</svg>
